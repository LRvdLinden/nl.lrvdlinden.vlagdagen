# Xcode-project voor Vlagdagen 2.0.0
# Genereer het project met:  brew install xcodegen && xcodegen
name: Vlagdagen

options:
  bundleIdPrefix: app.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vlagdagen:
    type: application
    platform: iOS
    sources:
      - Vlagdagen
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.vlagdagen
        PRODUCT_NAME: Vlagdagen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Vlagdagen/Info.plist
      properties:
        CFBundleDisplayName: Vlagdagen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.reference
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Alle vier standen vereist voor iPad-multitasking (App Store-validatie)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone blijft staand
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: app.lrvdlinden.vlagdagen
            CFBundleURLSchemes: [vlagdagen]
    dependencies:
      - target: VlagdagenWidget
        embed: true

  VlagdagenWidget:
    type: app-extension
    platform: iOS
    sources:
      - VlagdagenWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.vlagdagen.widget
        PRODUCT_NAME: VlagdagenWidget
        SKIP_INSTALL: YES
    info:
      path: VlagdagenWidget/Info.plist
      properties:
        CFBundleDisplayName: Vlagdagen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VlagdagenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VlagdagenTests
    dependencies:
      - target: Vlagdagen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.vlagdagen.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vlagdagen:
    build:
      targets:
        Vlagdagen: all
        VlagdagenWidget: all
    test:
      targets:
        - VlagdagenTests
      gatherCoverageData: true

name: App Store-screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: scripts/screenshots.sh
      - name: Push screenshots naar branch "screenshots"
        run: |
          echo "::notice::Bestanden: $(find AppStore/raw -name '*.png' | wc -l | tr -d ' ') — $(find AppStore/raw -name '*.png' | tr '\n' ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B screenshots
          git add -f AppStore/raw
          git commit -m "Ruwe App Store-screenshots uit de simulator"
          git push -f origin screenshots
      - name: Simulators bij fout
        if: failure()
        run: echo "::error::$(xcrun simctl list devices available | tr '\n' ' ')"

name: iOS build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:[int(n) for n in re.findall(r"\d+",t[0])],reverse=True)
          print(c[0][1]["udid"])')
          echo "::notice::Simulator $UDID"
          xcodebuild test \
            -project Vlagdagen.xcodeproj \
            -scheme Vlagdagen \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO | tail -n 120
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: |
            Vlagdagen.xcodeproj
            Vlagdagen/Info.plist
            VlagdagenWidget/Info.plist
